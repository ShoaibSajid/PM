name: Task
description: Create a new task to track work
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Task Details
        Use this template to create a new task for tracking work.
  
  - type: input
    id: title
    attributes:
      label: Task Title
      description: Brief title for the task
      placeholder: e.g., "Implement user authentication"
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the task
      placeholder: Describe what needs to be done
    validations:
      required: true
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: What is the priority of this task?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Current status of the task
      options:
        - To Do
        - In Progress
        - In Review
        - Done
      default: 0
    validations:
      required: true
  
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the criteria that must be met for this task to be considered complete
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
  
  - type: input
    id: estimated-hours
    attributes:
      label: Estimated Hours
      description: Estimated time to complete (in hours)
      placeholder: e.g., "8"
  
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any additional information or context
